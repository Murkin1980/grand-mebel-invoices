{% extends 'base.html' %}
{% block title %}Редактировать товар{% endblock %}
{% block page_title %}Редактировать товар{% endblock %}

{% block content %}
<div style="max-width:480px">
    <div class="card">
        <div class="card-header"><h3>{{ product.name }}</h3></div>
        <div class="card-body">
            <form action="{{ url_for('edit_product', id=product.id) }}" method="POST">
                <div class="form-group">
                    <label>Наименование *</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                <div class="form-group">
                    <label>Единица измерения</label>
                    <select name="unit" class="form-control">
                        {% for u in ['Штука', 'Услуга', 'м²', 'м', 'компл.', 'кг', 'л'] %}
                        <option value="{{ u }}" {% if product.unit == u %}selected{% endif %}>{{ u }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Цена по умолчанию (₸)</label>
                    <input type="number" name="default_price" class="form-control" value="{{ product.default_price }}" min="0" step="0.01">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-bottom:0">
                    <input type="checkbox" name="is_service" id="is_service" {% if product.is_service %}checked{% endif %} style="width:16px;height:16px">
                    <label for="is_service" style="text-transform:none;font-size:13px;color:#64748b;margin:0">Это услуга</label>
                </div>
                <div style="display:flex;gap:10px;margin-top:20px">
                    <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                    <a href="{{ url_for('products') }}" class="btn btn-outline">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
